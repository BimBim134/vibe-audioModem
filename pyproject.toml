[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vibemodem"
version = "0.0.0"
description = "One-way weak-signal data modem for radio amateurs"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
io = ["sounddevice>=0.5"]
app = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.8",
]
package = [
    "pyinstaller>=6.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vibemodem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
# The legacy prototype (tag legacy-v0) is kept in the tree for reference only.
extend-exclude = [
    "src/__init__.py",
    "src/audioModem",
    "src/misc",
    "src/rx",
    "src/tx",
    "src/ui",
    "research",
    "grc_files",
    "docs",
    "*.md",
    "main.py",
    "profile_memory.py",
    "view_profile.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
