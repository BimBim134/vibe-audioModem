<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe AudioModem</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 44rem; margin: 1.5rem auto; padding: 0 1rem; }
  fieldset { margin: 1rem 0; border: 1px solid #8886; border-radius: 6px; }
  legend { font-weight: 600; }
  label { display: inline-block; margin: 0.25rem 0.75rem 0.25rem 0; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; }
  button { font: inherit; padding: 0.4rem 0.9rem; margin: 0.25rem 0.25rem 0.25rem 0; }
  #error { color: #b00020; min-height: 1.4em; }
  #info { min-height: 1.4em; }
  li { margin: 0.4rem 0; }
  .part { opacity: 0.8; }
  .gap { color: #b00020; }
  #scope { position: relative; margin: 0.5rem 0; }
  #scope canvas { display: block; width: 100%; image-rendering: pixelated; background: #000; }
  #waterfall { height: 14rem; }
  #spectrum { height: 6rem; }
  #axis { position: relative; height: 1.4rem; font-size: 0.75rem; }
  #axis span { position: absolute; transform: translateX(-50%); }
  #legend { font-size: 0.75rem; opacity: 0.7; }
  h3 { font-size: 1rem; margin: 0.8rem 0 0.2rem; }
  #estimate.refused, #estimate .problem { color: #b00020; }
</style>
</head>
<body>
<h1>Vibe AudioModem</h1>
<p id="error" role="alert"></p>
<p id="info" aria-live="polite"></p>

<fieldset>
  <legend>Settings</legend>
  <label>Preset
    <select id="preset">
      <option value="max-range">Maximum range (slowest)</option>
      <option value="standard" selected>Standard</option>
      <option value="fast">Fast</option>
    </select>
  </label>
  <label>Input <select id="input_device"><option value="">default</option></select></label>
  <label>Output <select id="output_device"><option value="">default</option></select></label>
  <button id="apply">Apply</button>
</fieldset>

<fieldset>
  <legend>Send</legend>
  <textarea id="text" rows="3" placeholder="Message"></textarea>
  <label>Copies <input id="copies" type="number" min="1" max="8" value="1" style="width:4rem"></label>
  <label>Lowest tone (Hz) <input id="frequency" type="number" step="any" style="width:6rem"></label>
  <span id="range"></span>
  <p id="estimate" aria-live="polite"></p>
  <button id="send">Send</button>
  <button id="cancel">Cancel</button>
  <span id="sending"></span>
</fieldset>

<fieldset>
  <legend>Receive</legend>
  <button id="listen">Start listening</button>
  <span id="listening"></span>
  <div id="scope">
    <canvas id="spectrum" width="480" height="90" role="img" aria-label="Spectrum of the sound heard, 300 to 2700 Hz"></canvas>
    <canvas id="waterfall" width="480" height="120" role="img" aria-label="Waterfall: the spectrum over the last minute, newest at the top"></canvas>
    <div id="axis" aria-hidden="true"></div>
    <div id="legend">Levels from -100 dB (dark) to -20 dB (white), fixed. Blue band: where the next Message would be sent.</div>
  </div>
  <ul id="received"></ul>
  <h3>Detected, not decoded</h3>
  <ul id="undecoded"><li>None.</li></ul>
</fieldset>

<p><button id="quit">Quit</button></p>

<script>
const $ = (id) => document.getElementById(id);
const say = (id, text) => { $(id).textContent = text || ""; };
let state = { listening: false, sending: false };
let asked = 0;
let wasListening = false;
let lastSettings = null;

async function call(path, method, body) {
  const options = { method: method || "GET" };
  if (body !== undefined) {
    options.headers = { "Content-Type": "application/json" };
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const d = data.detail;
    const text = Array.isArray(d) ? d.map((e) => (e.loc ? e.loc.slice(1).join(".") + ": " : "") + e.msg).join("; ") : d;
    throw new Error(text || ("error " + response.status));
  }
  return data;
}
async function act(promise, then) {
  say("error", "");
  say("info", "");
  try { const data = await promise; if (then) then(data); }
  catch (error) { say("error", String(error.message || error)); }
  refresh();
}

function sendBody() {  // what is estimated is what is sent
  const frequency = $("frequency").value;
  return {
    text: $("text").value, copies: Number($("copies").value),
    frequency_hz: frequency === "" ? null : Number(frequency),
  };
}
function duration(seconds) {
  const whole = Math.round(seconds);
  if (whole < 60) return whole + " s";
  return Math.floor(whole / 60) + " min " + (whole % 60) + " s";
}
let estimate = { fits: false, frequency_problem: null };  // Send waits for the first answer
let estimateTimer = null;
function askEstimate() {
  clearTimeout(estimateTimer);
  estimateTimer = setTimeout(async () => {
    const mine = ++asked;
    let answer;
    try {
      answer = await call("/api/estimate", "POST", sendBody());
    } catch (error) {
      if (mine !== asked) return;
      estimate = { fits: false, frequency_problem: null };
      $("estimate").className = "refused";
      say("estimate", String(error.message || error));
      $("send").disabled = true;
      return;
    }
    if (mine !== asked) return;  // a newer question was asked: this answer is stale
    estimate = answer;
    const [low, high] = estimate.frequency_range_hz;
    signalWidthHz = estimate.signal_width_hz;
    drawScope();
    $("frequency").min = low; $("frequency").max = high;
    if ($("frequency").value === "") $("frequency").placeholder = estimate.default_frequency_hz;
    say("range", "from " + low + " to " + high + " Hz");
    const line = $("estimate");
    if (!estimate.fits) {
      line.className = "refused";
      line.textContent = estimate.reason;
    } else {
      line.className = "";
      line.textContent = estimate.fragments + " Fragment(s), about " + duration(estimate.airtime_seconds) +
        " on the air; at most " + estimate.max_bytes + " bytes in this Preset with these copies.";
      if (estimate.frequency_problem) {
        const problem = document.createElement("div");
        problem.className = "problem"; problem.textContent = estimate.frequency_problem;
        line.appendChild(problem);
      }
    }
    $("send").disabled = state.sending || !estimate.fits || Boolean(estimate.frequency_problem);
  }, 250);
}

function fillDevices(devices) {
  for (const [id, key] of [["input_device", "inputs"], ["output_device", "outputs"]]) {
    const select = $(id);
    if (select.options.length > 1) continue;
    for (const d of devices.filter((d) => d[key] > 0)) {
      const option = document.createElement("option");
      option.value = d.index; option.textContent = d.name; select.appendChild(option);
    }
  }
}
function deviceValue(id) {
  const value = $(id).value;
  return value === "" ? null : Number(value);
}

function quality(item) {
  const parts = [];
  if (item.frequency_hz !== null) parts.push(Math.round(item.frequency_hz) + " Hz (" + (item.offset_hz >= 0 ? "+" : "") + Math.round(item.offset_hz) + ")");
  if (item.snr_db !== null) parts.push("SNR " + Math.round(item.snr_db) + " dB");
  if (item.sync_score !== null) parts.push("sync " + Math.round(item.sync_score));
  return parts.join(", ");
}
function showReceived(items) {
  const list = $("received");
  list.replaceChildren();
  for (const item of items) {
    const li = document.createElement("li");
    if (item.complete) {
      li.textContent = "#" + item.number + "  " + item.text;
    } else {
      li.className = "part";
      const label = document.createElement("strong");
      label.textContent = "Incomplete (" + item.parts.length + " part(s), Fragments missing: " +
        item.missing.join(", ") + " of " + item.total + ")";
      li.appendChild(label);
      for (const [offset, text] of item.parts) {
        const piece = document.createElement("div");
        piece.textContent = "from byte " + offset + ": " + text;
        li.appendChild(piece);
      }
    }
    const detail = document.createElement("div");
    detail.className = "part"; detail.textContent = quality(item);
    li.appendChild(detail);
    list.appendChild(li);
  }
}
function showUndecoded(items) {
  const list = $("undecoded");
  list.replaceChildren();
  const now = Date.now() / 1000;
  for (const item of items.slice().reverse()) {
    const li = document.createElement("li");
    li.textContent = "Signal at " + Math.round(item.frequency_hz) + " Hz, " + duration(Math.max(0, now - item.heard_at)) + " ago, sync " + Math.round(item.sync_score);
    list.appendChild(li);
  }
  if (!items.length) {
    const none = document.createElement("li");
    none.textContent = "None.";
    list.appendChild(none);
  }
}

// The spectrum and the waterfall ----------------------------------------------------------
const MAX_ROWS = 120, MARKER_SECONDS = 120;
let lowHz = 300, highHz = 2700;  // the band of a row, told by the application with the rows
const FLOOR_DB = -100, CEILING_DB = -20;  // a fixed range: the same level is the same colour
let spectrumNext = 0, history = [], markers = [], signalWidthHz = 175;
function colour(t) {  // 0..1: black, blue, cyan, yellow, white
  t = Math.max(0, Math.min(1, t));
  const stops = [[0, 0, 0], [0, 0, 160], [0, 200, 220], [255, 230, 0], [255, 255, 255]];
  const x = t * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(x)), f = x - i;
  return stops[i].map((c, k) => Math.round(c + (stops[i + 1][k] - c) * f));
}
function transmitBand() {  // where the next Message would be sent: from the lowest tone up
  const typed = $("frequency").value;
  const start = typed === "" ? Number($("frequency").placeholder) || 1450 : Number(typed);
  return Number.isFinite(start) ? [start, start + signalWidthHz] : null;
}
function drawAxis() {
  const axis = $("axis");
  if (axis.childElementCount) return;
  for (let hz = 300; hz <= 2700; hz += 300) {
    const tick = document.createElement("span");
    tick.style.left = ((hz - lowHz) / (highHz - lowHz) * 100) + "%";
    tick.textContent = hz;
    axis.appendChild(tick);
  }
}
function drawScope() {
  const lo = FLOOR_DB, hi = CEILING_DB;
  const water = $("waterfall"), wctx = water.getContext("2d");
  const image = wctx.createImageData(water.width, water.height);
  history.slice().reverse().forEach((row, y) => {  // the newest at the top
    row.forEach((value, x) => {
      const [r, g, b] = colour((value - lo) / (hi - lo));
      const at = (y * water.width + x) * 4;
      image.data[at] = r; image.data[at + 1] = g; image.data[at + 2] = b; image.data[at + 3] = 255;
    });
  });
  wctx.putImageData(image, 0, 0);
  const curve = $("spectrum"), cctx = curve.getContext("2d");
  cctx.fillStyle = "#000"; cctx.fillRect(0, 0, curve.width, curve.height);
  const last = history[history.length - 1];
  if (last) {
    cctx.strokeStyle = "#7fdc7f"; cctx.beginPath();
    last.forEach((value, x) => {
      const y = curve.height - 2 - Math.max(0, Math.min(1, (value - lo) / (hi - lo))) * (curve.height - 6);
      x === 0 ? cctx.moveTo(x, y) : cctx.lineTo(x, y);
    });
    cctx.stroke();
  }
  const band = transmitBand();
  if (band) {  // the Signal that would be sent, to choose a free place for it
    for (const [canvas, context] of [[curve, cctx], [water, wctx]]) {
      const x0 = (band[0] - lowHz) / (highHz - lowHz) * canvas.width;
      const x1 = (band[1] - lowHz) / (highHz - lowHz) * canvas.width;
      context.fillStyle = "rgba(90, 160, 255, 0.35)";
      context.fillRect(x0, 0, Math.max(x1 - x0, 2), canvas.height);
      context.fillStyle = "#5aa0ff";
      context.fillRect(x0 - 1, 0, 2, canvas.height);
    }
  }
  for (const marker of markers) {  // where Messages were heard, or lost: on both drawings
    const x = (marker.hz - lowHz) / (highHz - lowHz);
    const colourOf = marker.lost ? "#ff5a5a" : "#5aff7a";
    cctx.fillStyle = colourOf; cctx.fillRect(x * curve.width - 1, 0, 3, curve.height);
    wctx.fillStyle = colourOf; wctx.fillRect(x * water.width - 1, 0, 2, water.height);
  }
}
async function refreshSpectrum() {
  if (!state.listening) return;  // nothing new while it does not listen: the last picture stays
  try {
    const data = await call("/api/spectrum?since=" + spectrumNext);
    lowHz = data.low_hz; highHz = data.low_hz + data.bin_hz * (data.rows[0] ? data.rows[0].length : 480);
    if (data.next < spectrumNext) history = [];  // the application started again
    spectrumNext = data.next;
    if (!data.rows.length) return;
    history = history.concat(data.rows).slice(-MAX_ROWS);
    drawScope();
  } catch (error) { /* the next refresh will say if the application does not answer */ }
}

async function refresh() {
  try {
    state = await call("/api/status");
    say("sending", state.sending ? "sending..." : "");
    say("listening", state.listening ? "listening" + (state.blocks_lost ? " (" + state.blocks_lost + " blocks lost)" : "") : "");
    if (state.listening && !wasListening) history = [];  // a new waterfall
    wasListening = state.listening;
    $("listen").textContent = state.listening ? "Stop listening" : "Start listening";
    const shown = JSON.stringify(state.settings);
    if (shown !== lastSettings) {  // only when they changed, so a choice not yet applied is kept
      lastSettings = shown;
      askEstimate();  // the Preset decides the airtime and the range of frequencies
      $("preset").value = state.settings.preset;
      $("input_device").value = state.settings.input_device === null ? "" : state.settings.input_device;
      $("output_device").value = state.settings.output_device === null ? "" : state.settings.output_device;
    }
    for (const id of ["preset", "input_device", "output_device", "apply"]) {
      $(id).disabled = state.sending || state.listening;
    }
    $("send").disabled = state.sending || !estimate.fits || Boolean(estimate.frequency_problem);
    $("cancel").disabled = !state.sending;
    if (state.last_error) say("error", state.last_error);
    const heard = await call("/api/received");
    showReceived(heard.received);
    showUndecoded(heard.undecoded);
    const now = Date.now() / 1000;
    markers = [
      ...heard.received.filter((m) => m.complete && m.frequency_hz !== null && now - m.heard_at < MARKER_SECONDS).map((m) => ({ hz: m.frequency_hz, lost: false })),
      ...heard.undecoded.filter((u) => now - u.heard_at < MARKER_SECONDS).map((u) => ({ hz: u.frequency_hz, lost: true })),
    ];
    drawScope();
  } catch (error) { say("error", "The application does not answer."); }
}

$("apply").onclick = () => act(call("/api/settings", "POST", {
  preset: $("preset").value, input_device: deviceValue("input_device"),
  output_device: deviceValue("output_device"),
}), () => say("info", "Settings applied."));
$("send").onclick = () => act(call("/api/send", "POST", sendBody()), (sent) => say("info", "Sending " + sent.fragments + " Fragment(s), " +
  sent.copies + " cop" + (sent.copies > 1 ? "ies" : "y") + ", about " +
  Math.round(sent.airtime_seconds) + " s on the air."));
for (const id of ["text", "copies", "frequency"]) $(id).addEventListener("input", askEstimate);
$("frequency").addEventListener("input", drawScope);  // the band moves as it is typed
$("cancel").onclick = () => act(call("/api/cancel", "POST"), () => say("info", "Cancelled."));
$("listen").onclick = () => act(call(state.listening ? "/api/listen/stop" : "/api/listen/start", "POST"));
$("quit").onclick = async () => {
  await call("/api/quit", "POST").catch(() => {});
  say("info", "Stopped. You can close this tab.");
};

(async () => { fillDevices((await call("/api/devices")).devices); lastSettings = null; refresh(); askEstimate(); })();
drawAxis();
setInterval(refresh, 1500);
setInterval(refreshSpectrum, 500);
</script>
</body>
</html>
