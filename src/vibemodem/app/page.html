<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe AudioModem</title>
<style>
  /* ============ THE COLOURS: the only place they are chosen =====================
     Three colours, each as three numbers (red green blue, 0 to 255) separated by spaces,
     not as #hex. Everything else on the page, and the charts (the script reads these same
     three), is made of them: a tint is the same colour at another opacity.
     Change a line here, save, and reload the page: no restart needed. */
  :root {
    --bg: 14 17 22;        /* background: the page, the dialogs, the darkest of the waterfall */
    --text: 232 234 237;   /* text, lines, received bubbles, the loudest of the waterfall */
    --accent: 255 154 31;  /* orange: what is yours (sent, the transmit band), the spectrum */
  }
  /* =============================================================================== */

  :root {
    color-scheme: dark;
    --line: rgb(var(--text) / 0.14);
    --soft: rgb(var(--text) / 0.62);
    scrollbar-color: rgb(var(--text) / 0.3) transparent;  /* the browser's own greys: ours instead */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 0.9rem; gap: 0.9rem; display: flex; flex-direction: column;
    background: rgb(var(--bg)); color: rgb(var(--text));
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  ::placeholder { color: var(--soft); opacity: 1; }
  option { background: rgb(var(--bg)); color: rgb(var(--text)); }
  select { accent-color: rgb(var(--accent)); }
  @supports (appearance: base-select) {
    select, ::picker(select) { appearance: base-select; }
    select::picker(select) {
      background: rgb(var(--bg)); border: 1px solid var(--line); border-radius: 12px;
      padding: 0.3rem; margin-top: 0.25rem;
    }
    select option { padding: 0.35rem 0.5rem; border-radius: 8px; }
    select option:hover, select option:focus { background: rgb(var(--accent) / 0.25); }
    select option:checked { background: rgb(var(--accent)); color: rgb(var(--bg)); }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  button {
    background: rgb(var(--text) / 0.08); border: 1px solid transparent; border-radius: 999px;
    padding: 0.4rem 1rem; cursor: pointer;
  }
  button:hover:not(:disabled) { background: rgb(var(--text) / 0.16); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: rgb(var(--accent)); color: rgb(var(--bg)); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: rgb(var(--accent) / 0.85); }
  button.sure { background: transparent; border-color: rgb(var(--accent)); color: rgb(var(--accent)); }
  :focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; }
  input, select, textarea {
    background: rgb(var(--text) / 0.06); border: 1px solid var(--line); border-radius: 10px;
    padding: 0.4rem 0.6rem;
  }
  input[type="checkbox"] { accent-color: rgb(var(--accent)); width: 1rem; height: 1rem; padding: 0; }
  #keep {
    appearance: none; position: relative; flex: none; margin-left: auto;
    width: 2.4rem; height: 1.35rem; padding: 0; border: 0; border-radius: 999px;
    background: rgb(var(--text) / 0.18); cursor: pointer;
    transition: background 0.15s ease;
  }
  #keep::before {
    content: ""; position: absolute; top: 0.18rem; left: 0.18rem;
    width: 0.99rem; height: 0.99rem; border-radius: 50%;
    background: rgb(var(--text) / 0.8);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  #keep:checked { background: rgb(var(--accent)); }
  #keep:checked::before { transform: translateX(1.05rem); background: rgb(var(--bg)); }
  #keep:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; }
  #keep:disabled { opacity: 0.4; cursor: default; }

  /* Never wider than this, however large the window: a page this wide reads badly */
  :root { --page-width: 1000px; }
  .top, main { width: min(100%, var(--page-width)); margin-inline: auto; }

  /* The top bar */
  .top {
    display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 1rem;
    border-radius: 16px; background: rgb(var(--text) / 0.03);
  }
  .top h1 { font-size: 1rem; font-weight: 600; margin: 0 auto 0 0; letter-spacing: 0.02em; }
  .status { display: flex; align-items: center; gap: 0.45rem; color: var(--soft); font-size: 0.85rem; }
  .status .warn { color: rgb(var(--accent)); }
  .dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: rgb(var(--text) / 0.3); }
  .dot.on { background: rgb(var(--accent)); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  /* Two columns: the charts, and the conversation */
  main {
    flex: 1; min-height: 0; display: grid; gap: 0.9rem;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
  }
  .charts {
    display: flex; flex-direction: column; gap: 0.5rem; min-height: 0;
    border-radius: 16px; padding: 0.9rem; background: rgb(var(--text) / 0.02);
  }
  .chart { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  canvas { display: block; width: 100%; border-radius: 10px; }
  #spectrum { flex: 0 0 28%; min-height: 0; background: rgb(var(--text) / 0.04); }
  #waterfall { flex: 1; min-height: 0; background: rgb(var(--bg)); }
  #axis { position: relative; height: 1.3rem; margin: 0.55rem 0; font-size: 0.75rem; color: var(--soft); }
  #axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  #axis span:first-child { transform: none; }
  #axis span:last-child { transform: translateX(-100%); }

  .chat {
    display: flex; flex-direction: column; min-height: 0;
    border-radius: 16px; padding: 0.9rem; background: rgb(var(--text) / 0.02);
  }
  #conversation { flex: 1; min-height: 12rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; padding: 0.2rem 0.2rem 0.8rem; }
  .empty { margin: auto; color: var(--soft); text-align: center; max-width: 18rem; }

  /* Bubbles */
  .row { display: flex; }
  .row.fresh { animation: arrive 0.25s ease-out; }  /* only a bubble that has just come */
  .row.out { justify-content: flex-end; }
  @keyframes arrive { from { opacity: 0; transform: translateY(6px); } }
  .bubble { max-width: 82%; padding: 0.5rem 0.8rem; border-radius: 16px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .bubble.in { background: rgb(var(--text) / 0.09); border-bottom-left-radius: 4px; }
  .bubble.out { background: rgb(var(--accent)); color: rgb(var(--bg)); border-bottom-right-radius: 4px; }
  .bubble.part { background: transparent; border: 1px dashed rgb(var(--text) / 0.45); border-bottom-left-radius: 4px; }
  .bubble.failed { background: transparent; border: 1px solid rgb(var(--accent)); color: rgb(var(--text)); }
  .meta { display: block; margin-top: 0.15rem; font-size: 0.75rem; opacity: 0.75; white-space: normal; }
  .head { display: block; font-size: 0.78rem; opacity: 0.8; margin-bottom: 0.15rem; }
  .bubble.coming { background: transparent; border: 1px solid rgb(var(--accent) / 0.6); border-bottom-left-radius: 4px; }
  .dots i { display: inline-block; width: 0.32rem; height: 0.32rem; margin-left: 0.22rem; border-radius: 50%; background: rgb(var(--accent)); animation: blink 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: 0.2s; }
  .dots i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  .note { align-self: center; font-size: 0.78rem; color: var(--soft); border: 1px dashed var(--line); border-radius: 999px; padding: 0.15rem 0.8rem; }

  /* The composer */
  #composer {
    border-radius: 16px; padding: 0.75rem; background: rgb(var(--text) / 0.03);
  }
  #composer .line { display: flex; gap: 0.5rem; align-items: flex-end; }
  #text { flex: 1; resize: none; border-radius: 16px; min-height: 2.6rem; max-height: 8rem; }
  .send-at { display: flex; align-items: center; gap: 0.5rem; margin: 0 0.2rem 0.5rem; font-size: 0.85rem; color: var(--soft); }
  .send-at input { padding: 0.2rem 0.5rem; }
  canvas { cursor: crosshair; }  /* a click on a chart places the Signal */
  .problem { margin: 0 0 0.4rem; font-size: 0.85rem; color: rgb(var(--accent)); }
  .problem:empty { display: none; }
  #estimate { margin: 0.4rem 0.2rem 0; font-size: 0.8rem; color: var(--soft); min-height: 1.1em; }
  #estimate.refused { color: rgb(var(--accent)); }
  .wide { width: 6rem; }
  .narrow { width: 4rem; }

  /* The settings */
  dialog { background: rgb(var(--bg)); color: rgb(var(--text)); border: 1px solid var(--line); border-radius: 18px; padding: 1.3rem; width: min(34rem, 94vw); }
  dialog::backdrop { background: rgb(var(--bg) / 0.75); }
  dialog h2 { margin: 0 0 0.8rem; font-size: 1.05rem; }
  dialog h3 { margin: 0 0 0.6rem; font-size: 0.9rem; }
  dialog .tabs {
    display: flex; gap: 0.35rem; margin: 0.2rem 0 1rem; padding: 0.25rem;
    border-radius: 12px; background: rgb(var(--text) / 0.04);
  }
  dialog .tab {
    flex: 1; border: 0; border-radius: 9px; padding: 0.45rem 0.8rem;
    background: transparent; color: var(--soft);
  }
  dialog .tab:hover:not(:disabled) { background: rgb(var(--text) / 0.08); }
  dialog .tab[aria-selected="true"] { background: rgb(var(--accent) / 0.14); color: rgb(var(--accent)); }
  dialog .tab[aria-selected="true"]:hover:not(:disabled) { background: rgb(var(--accent) / 0.2); }
  dialog .group { padding: 0.8rem 0.9rem; border-radius: 12px; background: rgb(var(--text) / 0.03); }
  dialog .group + .group { margin-top: 0.6rem; }
  dialog .group h3 { margin: 0 0 0.4rem; }
  #panel-general .field { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
  #panel-general .field > span { width: auto; }
  #panel-general .field > select,
  #panel-general .field > input { width: 100%; }
  #panel-advanced .field.limit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
  #panel-advanced .field.limit > span { width: auto; }
  .limit-control {
    display: flex; align-items: center;
    background: rgb(var(--text) / 0.06); border: 1px solid var(--line); border-radius: 10px;
    padding-right: 0.6rem;
  }
  .limit-control input {
    flex: 1; min-width: 0; background: transparent; border: 0; border-radius: 0;
    padding: 0.4rem 0.6rem;
  }
  .limit-control > span { color: var(--soft); }
  .limit-control:has(input:focus-visible) { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; }
  .limit-control input:focus-visible { outline: none; }
  dialog .field { display: flex; align-items: center; gap: 0.6rem; margin: 0.4rem 0; }
  dialog .field > span { width: 5rem; color: var(--soft); }
  dialog .field > span.plain { width: auto; }
  dialog select { flex: 1; min-width: 0; }
  dialog p { margin: 0.4rem 0; font-size: 0.82rem; color: var(--soft); }
  dialog p.problem { color: rgb(var(--accent)); }
  dialog .actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
  dialog .footer { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-top: 1rem; }
  dialog .footer .messages { flex: 1; min-width: 0; }
  dialog .footer p { margin: 0; }
  dialog .footer p + p { margin-top: 0.15rem; }
  dialog .footer .actions { margin-top: 0; flex: none; }
  #apply, #clear { width: 100%; }

  @media (max-width: 860px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; grid-template-rows: auto; }
    .chat { order: -1; }  /* the conversation first, as in a messenger */
    .chart { flex: none; }
    #spectrum { flex: none; height: 5.5rem; }
    #waterfall { flex: none; height: 11rem; }
    #conversation { min-height: 14rem; max-height: 55vh; }
  }
  @media (max-width: 560px) {
    .top { padding: 0.6rem 0.8rem; gap: 0.5rem; }
    .top h1 { white-space: nowrap; font-size: 0.95rem; }
    .status > span:not(.warn) { display: none; }  /* the dot says it; a loss of sound is still told */
    body { padding: 0.6rem; gap: 0.6rem; }
  }
</style>
</head>
<body>

<header class="top">
  <h1>Vibe AudioModem</h1>
  <span class="status"><i class="dot" id="dot"></i><span id="listening">Not listening</span></span>
  <button id="listen" class="primary">Listen</button>
  <button id="open-settings">Settings</button>
</header>

<main>
  <section class="charts" aria-label="What is heard">
    <div class="chart">
      <canvas id="spectrum" role="img" aria-label="Spectrum of the sound heard, 300 to 2700 Hz"></canvas>
      <div id="axis" aria-hidden="true"></div>
      <canvas id="waterfall" role="img" aria-label="Waterfall: the spectrum over the last minute, newest at the top"></canvas>
    </div>
  </section>

  <section class="chat" aria-label="Messages">
    <div id="conversation" role="log" aria-live="polite"></div>
    <form id="composer" autocomplete="off">
      <p id="error" class="problem" role="alert"></p>
      <label class="send-at">Send at
        <input id="frequency" class="wide" type="number" step="any" aria-describedby="range">
        Hz <span id="range"></span>
      </label>
      <div class="line">
        <textarea id="text" rows="1" placeholder="Write a message" aria-label="Message"></textarea>
        <button id="send" class="primary" type="submit">Send</button>
        <button id="cancel" type="button" hidden>Cancel</button>
      </div>
      <p id="estimate" aria-live="polite"></p>
    </form>
  </section>
</main>

<dialog id="settings" aria-labelledby="settings-title">
  <h2 id="settings-title">Settings</h2>

  <div class="tabs" role="tablist" aria-label="Settings sections">
    <button class="tab" id="tab-general" role="tab" aria-selected="true" aria-controls="panel-general">General</button>
    <button class="tab" id="tab-advanced" role="tab" aria-selected="false" aria-controls="panel-advanced" tabindex="-1">Advanced settings</button>
  </div>

  <section id="panel-general" role="tabpanel" aria-labelledby="tab-general">
    <div class="group">
      <h3>Audio device</h3>
      <label class="field"><span>Input</span><select id="input_device"><option value="">default</option></select></label>
      <label class="field"><span>Output</span><select id="output_device"><option value="">default</option></select></label>
    </div>
    <div class="group">
      <h3>Modulation</h3>
      <label class="field"><span>Preset</span>
        <select id="preset">
          <option value="max-range">Slow - Maximum Range (29 Hz)</option>
          <option value="standard" selected>Standard (107 Hz)</option>
          <option value="fast">Fast - Good Conditions (212 Hz)</option>
        </select>
      </label>
      <label class="field"><span>Repetitions</span><input id="copies" class="narrow" type="number" min="1" max="8" value="1"></label>
    </div>
    <div class="actions"><button id="apply" class="primary">Apply</button></div>
  </section>

  <section id="panel-advanced" role="tabpanel" aria-labelledby="tab-advanced" hidden>
    <div class="group">
      <h3>Stored receptions</h3>
      <p>For debug purpose only, each message reception can be stored with 3 s around each Signal. The oldest are deleted first when the limit is reached.</p>
      <label class="field">
        Keep the audio and the figures of what is received
        <input id="keep" type="checkbox">
      </label>
      <label class="field limit">
        <span>Up to</span>
        <span class="limit-control"><input id="limit" type="number" min="10" max="100000" step="10"><span>MB</span></span>
      </label>
      <p id="usage" aria-live="polite"></p>
      <div class="actions"><button id="clear">Delete all stored receptions</button></div>
    </div>
  </section>

  <div class="footer">
    <div class="messages">
      <p id="settings-error" class="problem" role="alert"></p>
      <p id="settings-note" aria-live="polite"></p>
    </div>
    <div class="actions"><button id="quit">Quit the application</button><button id="close-settings" class="primary">Done</button></div>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const say = (id, text) => { $(id).textContent = text || ""; };

// The three colours are the ones of the style sheet above: read from it, never repeated here.
const triple = (name, fallback) => {
  const value = getComputedStyle(document.documentElement).getPropertyValue(name).trim().split(/[\s,]+/).map(Number);
  return value.length === 3 && value.every((n) => n >= 0 && n <= 255) ? value : fallback;  // not "r g b"? then ours
};
const BG = triple("--bg", [14, 17, 22]), TEXT = triple("--text", [232, 234, 237]), ACCENT = triple("--accent", [255, 154, 31]);
const rgb = (c, alpha = 1) => `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha})`;
const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));

let state = { listening: false, sending: false, settings: {} };
let asked = 0, refreshes = 0, wasListening = false, lastSettings = null;

async function call(path, method, body) {
  const options = { method: method || "GET" };
  if (body !== undefined) {
    options.headers = { "Content-Type": "application/json" };
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const d = data.detail;
    const text = Array.isArray(d) ? d.map((e) => (e.loc ? e.loc.slice(1).join(".") + ": " : "") + e.msg).join("; ") : d;
    throw new Error(text || ("error " + response.status));
  }
  return data;
}
// A failure is told where the person is looking: under the composer, or in the open dialog.
const showError = (text, where = "error") => say(where, text ? "! " + text : "");
async function act(promise, then, where = "error") {
  showError("", where);
  try { const data = await promise; if (then) then(data); }
  catch (error) { showError(String(error.message || error), where); }
  refresh();
}
// A click that cannot be undone asks for a second one (the browser's own dialogs ignore our colours).
function confirmed(button, label, action) {
  button.onclick = () => {
    if (button.dataset.sure) { clearTimeout(Number(button.dataset.sure)); delete button.dataset.sure; button.textContent = label; button.classList.remove("sure"); action(); return; }
    button.textContent = "Click again to confirm"; button.classList.add("sure");
    button.dataset.sure = setTimeout(() => { delete button.dataset.sure; button.textContent = label; button.classList.remove("sure"); }, 4000);
  };
}

// The estimate, before sending ------------------------------------------------------------------
function sendBody() {  // what is estimated is what is sent
  const frequency = $("frequency").value;
  return { text: $("text").value, copies: Number($("copies").value), frequency_hz: frequency === "" ? null : Number(frequency) };
}
function duration(seconds) {
  const whole = Math.round(seconds);
  return whole < 60 ? whole + " s" : Math.floor(whole / 60) + " min " + (whole % 60) + " s";
}
let estimate = { fits: false, frequency_problem: null };  // Send waits for the first answer
let estimateTimer = null;
function canSend() {
  return !state.sending && estimate.fits && !estimate.frequency_problem && $("text").value.trim() !== "";
}
function askEstimate() {
  const mine = ++asked;  // any answer to an earlier question is stale from now on
  $("send").disabled = true;
  clearTimeout(estimateTimer);
  estimateTimer = setTimeout(async () => {
    let answer;
    try { answer = await call("/api/estimate", "POST", sendBody()); }
    catch (error) {
      if (mine !== asked) return;
      estimate = { fits: false, frequency_problem: null };
      $("estimate").className = "refused"; say("estimate", String(error.message || error));
      return;
    }
    if (mine !== asked) return;
    estimate = answer;
    const [low, high] = estimate.frequency_range_hz;
    signalWidthHz = estimate.signal_width_hz;
    $("frequency").min = low; $("frequency").max = high;
    if ($("frequency").value === "") $("frequency").placeholder = estimate.default_frequency_hz;
    say("range", low + " to " + high + " Hz");
    const line = $("estimate");
    const problem = !estimate.fits ? estimate.reason : estimate.frequency_problem;
    line.className = problem ? "refused" : "";
    line.textContent = problem || (estimate.fragments + (estimate.fragments > 1 ? " Fragments" : " Fragment") +
      " · about " + duration(estimate.airtime_seconds) + " on the air · up to " + estimate.max_bytes + " bytes here");
    $("send").disabled = !canSend();
    drawScope();
  }, 250);
}

// The conversation ------------------------------------------------------------------------------
const clock = (at) => new Date(at * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const hz = (v) => Math.round(v) + " Hz";
function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function partialText(item) {  // what was read of a Message, the gaps shown as "..."
  const pieces = item.parts.slice().sort((a, b) => a[0] - b[0]);
  let text = pieces.length && pieces[0][0] > 0 ? "… " : "";
  pieces.forEach(([offset, part], i) => { text += (i ? " … " : "") + part; });
  return text + (item.missing.includes(item.total - 1) ? " …" : "");
}
function bubble(item) {
  if (item.kind === "arriving") {  // the Preamble is heard: a Message is coming in at this frequency
    const row = element("div", "row in");
    const box = element("div", "bubble in coming", "Receiving a signal at " + hz(item.frequency_hz));
    const dots = element("span", "dots");
    dots.setAttribute("aria-hidden", "true");
    dots.append(element("i"), element("i"), element("i"));
    box.appendChild(dots);
    row.appendChild(box);
    return row;
  }
  if (item.kind === "lost") return element("div", "note", "Signal detected at " + hz(item.frequency_hz) + ", not decoded · " + clock(item.at));
  const row = element("div", "row " + (item.kind === "sent" ? "out" : "in"));
  const box = element("div", "bubble");
  row.appendChild(box);
  let meta = [];
  box.appendChild(element("span", "sr", item.kind === "sent" ? "You sent: " : "Received: "));
  if (item.kind === "sent") {
    box.classList.add(item.status === "failed" ? "failed" : "out");
    box.appendChild(document.createTextNode(item.text));
    const status = { sending: "sending…", sent: "sent", cancelled: "cancelled", failed: "failed" }[item.status];
    meta = [status, duration(item.airtime_seconds), hz(item.frequency_hz)];
    if (item.copies > 1) meta.push(item.copies + " copies");
    if (item.error) meta.push(item.error);
  } else if (item.kind === "incomplete") {
    box.classList.add("in", "part");
    const got = item.total - item.missing.length;
    box.appendChild(element("span", "head", "Incomplete · " + got + " of " + item.total + " fragments"));
    box.appendChild(document.createTextNode(partialText(item)));
    meta = [item.frequency_hz === null ? null : hz(item.frequency_hz)];
  } else {
    box.classList.add("in");
    box.appendChild(document.createTextNode(item.text));
    meta = [item.frequency_hz === null ? null : hz(item.frequency_hz), item.snr_db === null ? null : "SNR " + Math.round(item.snr_db) + " dB"];
  }
  box.appendChild(element("span", "meta", meta.filter(Boolean).concat(clock(item.at)).join(" · ")));
  return row;
}
// What is on screen, by identifier: a bubble is built once, rebuilt only when it changes (the
// text of a Message can be selected, a bubble does not play its arrival again), and only a new
// one arrives with a movement.
const shown = new Map();
let firstFill = true;
function showConversation(items) {
  const box = $("conversation");
  const atBottom = firstFill || box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const keep = new Set(items.map((item) => item.id));
  for (const [id, entry] of shown) if (!keep.has(id)) { entry.node.remove(); shown.delete(id); }
  const nodes = items.map((item) => {
    const signature = JSON.stringify(item), entry = shown.get(item.id);
    if (entry && entry.signature === signature) return entry.node;
    const node = bubble(item);
    if (!entry && !firstFill) {
      node.classList.add("fresh");
      node.addEventListener("animationend", () => node.classList.remove("fresh"), { once: true });  // a move later must not replay it
    }
    if (entry) entry.node.replaceWith(node);
    shown.set(item.id, { signature, node });
    return node;
  });
  box.querySelector(".empty")?.remove();
  nodes.forEach((node, i) => { if (box.children[i] !== node) box.insertBefore(node, box.children[i] || null); });
  if (!items.length) box.appendChild(element("div", "empty", "No messages yet. Press Listen to receive, or write one below."));
  if (atBottom) box.scrollTop = box.scrollHeight;
  firstFill = false;
}

// The spectrum and the waterfall ----------------------------------------------------------------
const MAX_ROWS = 120, MARKER_SECONDS = 60;
let lowHz = 300, highHz = 2700;  // the band of a row, told by the application with the rows
const FLOOR_DB = -100, CEILING_DB = -20;  // a fixed range: the same level is the same colour
let spectrumNext = 0, history = [], markers = [], signalWidthHz = 175;
// The waterfall, from the quietest to the loudest: background, a dim orange, orange, white.
const RAMP = [[0, BG], [0.5, mix(BG, ACCENT, 0.25)], [0.85, ACCENT], [1, TEXT]];
function colour(t) {
  t = Number.isFinite(t) ? Math.max(0, Math.min(1, t)) : 0;
  const next = RAMP.findIndex(([at]) => at > t);  // the first stop above this level
  const i = next < 0 ? RAMP.length - 2 : next - 1;
  const [t0, c0] = RAMP[i], [t1, c1] = RAMP[i + 1];
  return mix(c0, c1, (t - t0) / (t1 - t0));
}
function transmitBand() {  // where the next Message would be sent: from the lowest tone up
  const typed = $("frequency").value;
  const start = typed === "" ? Number($("frequency").placeholder) || 1450 : Number(typed);
  return Number.isFinite(start) ? [start, start + signalWidthHz] : null;
}
let axisFor = "";
function drawAxis() {
  if (axisFor === lowHz + "-" + highHz) return;
  axisFor = lowHz + "-" + highHz;
  const axis = $("axis");
  axis.replaceChildren();
  const step = 300;
  for (let f = Math.ceil(lowHz / step) * step; f <= highHz; f += step) {
    const tick = element("span", "", f);
    tick.style.left = ((f - lowHz) / (highHz - lowHz) * 100) + "%";
    axis.appendChild(tick);
  }
}
const buffer = document.createElement("canvas");  // one pixel per cell, scaled when drawn
function fit(canvas) {  // as many pixels as the screen shows, so that lines stay thin
  const scale = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(canvas.clientWidth * scale));
  canvas.height = Math.max(1, Math.round(canvas.clientHeight * scale));
}
function drawScope() {
  const water = $("waterfall"), wctx = water.getContext("2d");
  wctx.fillStyle = rgb(BG); wctx.fillRect(0, 0, water.width, water.height);
  const width = history.length ? history[0].length : 480;
  if (history.length) {
    buffer.width = width; buffer.height = MAX_ROWS;
    const bctx = buffer.getContext("2d");
    const image = bctx.createImageData(width, MAX_ROWS);
    history.slice().reverse().forEach((row, y) => {  // the newest at the top
      for (let x = 0; x < width; x++) {
        const [r, g, b] = colour((row[x] - FLOOR_DB) / (CEILING_DB - FLOOR_DB));
        const at = (y * width + x) * 4;
        image.data[at] = r; image.data[at + 1] = g; image.data[at + 2] = b; image.data[at + 3] = 255;
      }
    });
    bctx.putImageData(image, 0, 0);
    wctx.imageSmoothingEnabled = false;
    wctx.drawImage(buffer, 0, 0, width, MAX_ROWS, 0, 0, water.width, water.height);
  }
  const curve = $("spectrum"), cctx = curve.getContext("2d");
  cctx.clearRect(0, 0, curve.width, curve.height);
  const last = history[history.length - 1];
  const line = Math.max(1, window.devicePixelRatio || 1);
  if (last) {
    const curvePath = new Path2D();
    last.forEach((value, x) => {
      const level = Number.isFinite(value) ? Math.max(0, Math.min(1, (value - FLOOR_DB) / (CEILING_DB - FLOOR_DB))) : 0;
      const px = x / (last.length - 1) * curve.width, py = curve.height - 3 * line - level * (curve.height - 8 * line);
      x === 0 ? curvePath.moveTo(px, py) : curvePath.lineTo(px, py);
    });
    const fillPath = new Path2D(curvePath);
    fillPath.lineTo(curve.width, curve.height); fillPath.lineTo(0, curve.height); fillPath.closePath();
    cctx.fillStyle = rgb(ACCENT); cctx.fill(fillPath);
    cctx.strokeStyle = rgb(ACCENT); cctx.lineWidth = line; cctx.stroke(curvePath);
  }
  const span = highHz - lowHz;
  const band = transmitBand();
  if (band) {  // the Signal that would be sent: to choose a free place for it
    for (const [canvas, ctx] of [[curve, cctx], [water, wctx]]) {
      const x0 = (band[0] - lowHz) / span * canvas.width, x1 = (band[1] - lowHz) / span * canvas.width;
      ctx.fillStyle = rgb(ACCENT, 0.28); ctx.fillRect(x0, 0, Math.max(x1 - x0, 2 * line), canvas.height);
      ctx.fillStyle = rgb(ACCENT); ctx.fillRect(x0 - line / 2, 0, line, canvas.height);
    }
  }
  const now = Date.now() / 1000;
  for (const marker of markers) {  // where Messages were heard: on both drawings
    const fade = Math.min(1, Math.max(0, 1 - (now - marker.at) / MARKER_SECONDS));
    for (const [canvas, ctx] of [[curve, cctx], [water, wctx]]) {
      const x = (marker.hz - lowHz) / span * canvas.width;
      ctx.strokeStyle = rgb(TEXT, 0.9 * fade); ctx.lineWidth = line;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
  }
  drawAxis();
}
async function refreshSpectrum() {
  if (!state.listening) return;  // nothing new while it does not listen: the last picture stays
  try {
    const data = await call("/api/spectrum?since=" + spectrumNext);
    lowHz = data.low_hz; highHz = data.low_hz + data.bin_hz * (data.rows[0] ? data.rows[0].length : 480);
    if (data.next < spectrumNext) history = [];  // the application started again
    spectrumNext = data.next;
    if (!data.rows.length) return;
    history = history.concat(data.rows).slice(-MAX_ROWS);
    drawScope();
  } catch (error) { /* the next refresh will say if the application does not answer */ }
}
function fitAll() { fit($("spectrum")); fit($("waterfall")); drawScope(); }
window.addEventListener("resize", fitAll);

// Settings and storage --------------------------------------------------------------------------
function fillDevices(devices) {
  for (const [id, key] of [["input_device", "inputs"], ["output_device", "outputs"]]) {
    const select = $(id);
    if (select.options.length > 1) continue;
    for (const d of devices.filter((d) => d[key] > 0)) select.appendChild(new Option(d.name, d.index));
  }
}
const deviceValue = (id) => ($(id).value === "" ? null : Number($(id).value));
async function refreshStorage() {
  try {
    const info = await call("/api/storage");
    for (const id of ["keep", "limit", "clear"]) $(id).disabled = !info.available;
    if (!info.available) { say("usage", "Receptions cannot be kept: there is nowhere to keep them."); return; }
    if (document.activeElement !== $("limit")) $("limit").value = Math.round(info.limit_mb);
    $("keep").checked = info.keep;
    say("usage", info.count + " kept, " + info.used_mb.toFixed(1) + " MB of " + Math.round(info.limit_mb) + " MB, in " + info.directory);
  } catch (error) { /* refresh will say if the application does not answer */ }
}
const tabs = [$("tab-general"), $("tab-advanced")];
function showTab(tab) {
  for (const other of tabs) {
    const selected = other === tab;
    other.setAttribute("aria-selected", selected);
    other.tabIndex = selected ? 0 : -1;
    $(other.getAttribute("aria-controls")).hidden = !selected;
  }
}
for (const tab of tabs) {
  tab.onclick = () => showTab(tab);
  tab.addEventListener("keydown", (event) => {
    const index = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight") next = tabs[(index + 1) % tabs.length];
    else if (event.key === "ArrowLeft") next = tabs[(index - 1 + tabs.length) % tabs.length];
    else if (event.key === "Home") next = tabs[0];
    else if (event.key === "End") next = tabs[tabs.length - 1];
    else return;
    event.preventDefault();
    showTab(next);
    next.focus();
  });
}
let appliedTimer;
function showApplied() {
  const button = $("apply");
  button.textContent = "Applied.";
  clearTimeout(appliedTimer);
  appliedTimer = setTimeout(() => { button.textContent = "Apply"; }, 2000);
}
$("apply").onclick = () => act(call("/api/settings", "POST", {
  preset: $("preset").value, input_device: deviceValue("input_device"), output_device: deviceValue("output_device"),
}), showApplied, "settings-error");
$("keep").onchange = () => act(call("/api/storage", "POST", { keep: $("keep").checked }), refreshStorage, "settings-error");
$("limit").onchange = () => act(call("/api/storage", "POST", { limit_mb: Number($("limit").value) }), refreshStorage, "settings-error");
confirmed($("clear"), "Delete all stored receptions", () =>
  act(call("/api/storage/clear", "POST"), (done) => { say("usage", done.deleted + " deleted."); refreshStorage(); }, "settings-error"));
$("open-settings").onclick = () => $("settings").showModal();
$("close-settings").onclick = () => $("settings").close();
confirmed($("quit"), "Quit the application", async () => {
  await call("/api/quit", "POST").catch(() => {});
  $("settings").close();
  document.body.replaceChildren(element("p", "empty", "Stopped. You can close this tab."));
});

// Sending, listening ----------------------------------------------------------------------------
$("composer").onsubmit = (event) => {
  event.preventDefault();
  if (!canSend()) return;
  act(call("/api/send", "POST", sendBody()), () => { $("text").value = ""; grow(); askEstimate(); });
};
$("cancel").onclick = () => act(call("/api/cancel", "POST"));
$("listen").onclick = () => act(call(state.listening ? "/api/listen/stop" : "/api/listen/start", "POST"));
const grow = () => { $("text").style.height = "auto"; $("text").style.height = Math.min($("text").scrollHeight, 128) + "px"; };
$("text").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); $("composer").requestSubmit(); }
});
// What is set for sending is kept for next time (if the browser allows it).
for (const id of ["copies", "frequency"]) {
  try { const saved = localStorage.getItem("vibemodem." + id); if (saved !== null) $(id).value = saved; } catch (error) { /* no storage: the page still works */ }
  $(id).addEventListener("input", () => { try { localStorage.setItem("vibemodem." + id, $(id).value); } catch (error) { /* idem */ } });
}
for (const id of ["text", "copies", "frequency"]) $(id).addEventListener("input", askEstimate);
$("text").addEventListener("input", grow);
$("frequency").addEventListener("input", drawScope);  // the band moves as it is typed
// A click on a chart puts the Signal there: the band is centred on the click.
for (const canvas of [$("spectrum"), $("waterfall")]) {
  canvas.addEventListener("click", (event) => {
    const rect = canvas.getBoundingClientRect();
    const clicked = lowHz + (event.clientX - rect.left) / rect.width * (highHz - lowHz);
    let start = clicked - signalWidthHz / 2;
    if (estimate.frequency_range_hz) start = Math.max(estimate.frequency_range_hz[0], Math.min(estimate.frequency_range_hz[1], start));
    $("frequency").value = Math.round(start);
    $("frequency").dispatchEvent(new Event("input"));  // saved, estimated, drawn
  });
}

async function refresh() {
  const mine = ++refreshes;  // an answer that comes after a newer one is not shown
  try {
    const status = await call("/api/status");
    const conversation = (await call("/api/conversation")).items;
    if (mine !== refreshes) return;
    state = status;
    $("dot").className = "dot" + (state.listening ? " on" : "");
    const lost = state.blocks_lost ? " · " + state.blocks_lost + " blocks of sound lost" : "";
    $("listening").className = state.blocks_lost ? "warn" : "";
    say("listening", state.listening ? "Listening" + lost : "Not listening");
    if (state.listening && !wasListening) history = [];  // a new waterfall
    wasListening = state.listening;
    $("listen").textContent = state.listening ? "Stop" : "Listen";
    const settings = JSON.stringify(state.settings);
    if (settings !== lastSettings) {  // only when they changed, so a choice not yet applied is kept
      lastSettings = settings;
      askEstimate();  // the Preset decides the airtime and the range of frequencies
      $("preset").value = state.settings.preset;
      $("input_device").value = state.settings.input_device === null ? "" : state.settings.input_device;
      $("output_device").value = state.settings.output_device === null ? "" : state.settings.output_device;
    }
    const busy = state.sending || state.listening;
    for (const id of ["preset", "input_device", "output_device", "apply"]) $(id).disabled = busy;
    if (busy) say("settings-note", "Stop listening and sending to change these.");
    else if ($("settings-note").textContent.startsWith("Stop listening")) say("settings-note", "");
    $("send").hidden = state.sending; $("cancel").hidden = !state.sending;
    $("send").disabled = !canSend();
    if (state.last_error) showError(state.last_error);
    refreshStorage();
    showConversation(conversation);
    const now = Date.now() / 1000;
    markers = conversation
      .filter((m) => m.kind === "received" && m.frequency_hz !== null && now - m.at < MARKER_SECONDS)
      .map((m) => ({ hz: m.frequency_hz, at: m.at }));
    drawScope();
  } catch (error) { showError("The application does not answer."); }
}

fitAll();
(async () => { fillDevices((await call("/api/devices")).devices); lastSettings = null; refresh(); askEstimate(); grow(); })();
setInterval(refresh, 1000);
setInterval(refreshSpectrum, 500);
</script>
</body>
</html>
