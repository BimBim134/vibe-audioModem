<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Vibe Audio Modem</title>
    <link rel="stylesheet" href="https://unpkg.com/uplot/dist/uPlot.min.css">
    <script src="https://unpkg.com/uplot/dist/uPlot.iife.min.js"></script>
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body>
    <div class="container">
        <div class="layout">
            <div class="column column-left">
                <section class="module spectroscope">
                    <div class="plot-container">
                        <div id="spectroscope-div"></div>
                    </div>
                </section>

                <section class="module spectrogram">
                    <div class="plot-container">
                        <canvas id="spectrogram-canvas" width="4096" height="500"></canvas>
                        <canvas id="spectrogram-overlay" width="4096" height="500"></canvas>
                    </div>
                </section>
            </div>

            <div class="column column-right">
                <section class="module controls">
                    <div class="control-group">
                        <label for="carrier-freq">Carrier Frequency (Hz):</label>
                        <input type="number" id="carrier-freq" value="1000" min="100" max="8000" step="100">
                    </div>

                    <div class="control-group">
                        <label for="modulation-preset">Modulation:</label>
                        <select id="modulation-preset">
                            <!--
                            # added here are the modulation preset from modulation_presets.json
                            -->
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="sender-name">Sender Name:</label>
                        <input type="text" id="sender-name" value="Me" maxlength="20">
                    </div>
                </section>

                <section class="module messages">
                    <div class="messages-board" id="messages-board">
                        <div class="message system">
                            <div class="message-content">Welcome to vibe-audioModem. Waiting for transmission...</div>
                        </div>
                        <!--
                        <div class="message sent">
                            <div class="message-header">
                                <span class="sender">Joe</span>
                                <span class="meta">3200 Hz — 14:12:14</span>
                            </div>
                            <div class="message-content">Hello Eric !</div>
                        </div>
                        <div class="message received">
                            <div class="message-header">
                                <span class="sender">Eric</span>
                                <span class="meta">3200 Hz — 14:15:48</span>
                            </div>
                            <div class="message-content">Hello Joe how are you?</div>
                        </div>
                        -->
                    </div>
                </section>

                <section class="module compose">
                    <textarea id="message-input" placeholder="Tapez votre message..." rows="3"></textarea>
                    <button id="send-button">Envoyer</button>
                </section>
            </div>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>

</html>
